[project]
name = "customer-service-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.147.0",
    "jieba>=0.42.1",
    "langchain-core>=1.7.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "mcp>=1.30,<2",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "sentence-transformers>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not embedding"]
markers = ["embedding: 需要真实的 BGE-M3 模型（EMBEDDING_MODEL_DIR），默认不跑，用 -m embedding 运行"]
timeout = 60
