# 完整启动：docker compose up -d --build（浏览器打开 http://localhost:3000）
# 本地开发只启动数据库：docker compose up -d db
# 在根目录的终端运行，不要在设置了 $env:POSTGRES_DB 的终端里运行

# 后端镜像的公共部分：后端、MCP Server、数据库迁移共用
x-backend: &backend
  build: ./backend
  image: ai-customer-service-backend
  # 密钥、数据库账号、大模型配置都从 .env 读取
  env_file: .env
  # 容器之间的地址，覆盖 .env 里的同名项
  environment:
    POSTGRES_HOST: db
    # 容器之间连数据库的端口，和 .env 里映射到本机的 POSTGRES_PORT 无关
    POSTGRES_PORT: "5432"
    # 后端给 MCP 签发令牌：签发方和接收方，两边用同样的值才能对上
    BACKEND_URL: http://backend:8000
    MCP_SERVER_URL: http://mcp:8001/mcp
    # 镜像里没有 BGE-M3 模型，固定用关键词检索
    RETRIEVAL_MODE: keyword

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性任务：数据库就绪后升级到最新结构，然后退出。失败时后面的服务都不会启动
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  mcp:
    <<: *backend
    command: ["uvicorn", "app.mcp_server.main:create_mcp_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    # 只给后端用，不映射到本机
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # uvicorn 在启动检查（核对知识库索引）通过后才监听端口，所以能连上就说明已就绪
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *backend
    # 只开一个后端进程，不要加 --workers：知识库的索引任务在后端进程里排队执行，
    # 启动时还会把上次没做完的任务标成失败，多个进程会把彼此正在做的任务标成失败。
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        # 浏览器访问后端的地址，构建时写进前端代码，改了要重新构建。
        # 主机名要和打开前端页面用的一致（都用 localhost），否则浏览器不会带上登录 Cookie
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    image: ai-customer-service-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
